# Taskfile.yml — maddi-mod (https://taskfile.dev). The open-source corpus tooling is maddi's corpus/, the
# sibling ../maddi (here from the split until 2026-10-03, see maddi's docs/roadmap/split-maddi-into-three-
# repositories.md §7); it is included so that `task corpus:*` works from here as well:
#   task corpus:doctor · task corpus:install:wired · task corpus:config:all · task corpus:test:slow
# The slow tests (test:slow, sweep) run in this checkout; the CLI and the build plugins are ../maddi-dist.

version: '3'

includes:
  corpus:
    taskfile: ../maddi/corpus/Taskfile.yml
    dir: ../maddi/corpus

# Task does not read an included Taskfile's dotenv, so load the corpus .env (written by
# `task corpus:init`; optional) here — `task corpus:*` then behaves exactly like running
# task from corpus/ itself.
dotenv: ['../maddi/corpus/.env']

tasks:
  default:
    cmds: [task --list]
